<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Traffic Volume Survey Tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --bg-app: #f4f5f0;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #ffffff;
  --bg-subtle: #eeefe9;
  --border-subtle: #e2e4dc;
  --border-strong: #cfd2c6;
  --text-main: #141b14;
  --text-muted: #5e665e;
  --text-subtle: #899388;
  --brand-green: #9fe870;
  --brand-green-hover: #8be058;
  --brand-green-text: #163300;
  --brand-dark-forest: #163300;
  --danger: #d9383a;
  --danger-bg: #fde8e8;
  --danger-text: #9b1c1c;
  --card-radius: 24px;
  --inner-radius: 16px;
  --pill-radius: 9999px;
  --shadow-sm: 0 2px 8px rgba(20, 27, 20, 0.04);
  --shadow-md: 0 12px 32px rgba(20, 27, 20, 0.08);
}
html.dark {
  --bg-app: #0e120f;
  --bg-surface: #171d18;
  --bg-surface-elevated: #202721;
  --bg-subtle: #222a23;
  --border-subtle: #2d362e;
  --border-strong: #3b463c;
  --text-main: #f5f8f5;
  --text-muted: #9ba79b;
  --text-subtle: #6c776d;
  --brand-green: #9fe870;
  --brand-green-hover: #aef085;
  --brand-green-text: #0e120f;
  --brand-dark-forest: #9fe870;
  --danger: #ef4444;
  --danger-bg: #381b1b;
  --danger-text: #fca5a5;
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 16px 40px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0; background-color: var(--bg-app); color: var(--text-main);
  font-family: var(--font-main); -webkit-font-smoothing: antialiased; min-height: 100vh;
  display: flex; flex-direction: column;
}
.app-container { max-width: 680px; margin: 0 auto; width: 100%; padding: 20px 16px 80px; display: flex; flex-direction: column; gap: 16px; }
.header-bar {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--pill-radius);
  box-shadow: var(--shadow-sm); margin-bottom: 8px;
}
.brand-badge { display: flex; align-items: center; gap: 10px; font-family: var(--font-heading); font-weight: 800; font-size: 17px; letter-spacing: -0.02em; color: var(--text-main); }
.brand-icon { width: 34px; height: 34px; background: var(--brand-green); color: #163300; border-radius: var(--pill-radius); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.btn-icon-pill {
  height: 40px; padding: 0 16px; border-radius: var(--pill-radius); background: var(--bg-subtle);
  border: 1px solid var(--border-subtle); color: var(--text-main); font-family: var(--font-heading);
  font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.15s ease;
}
.btn-icon-pill:hover { background: var(--border-subtle); }
.btn-menu-pill {
  width: 40px; height: 40px; border-radius: var(--pill-radius); background: var(--bg-subtle);
  border: 1px solid var(--border-subtle); color: var(--text-main); display: flex; align-items: center;
  justify-content: center; cursor: pointer; padding: 0; transition: all 0.15s ease;
}
.btn-menu-pill:hover { background: var(--border-subtle); }
.ov { position: fixed; inset: 0; background: rgba(14, 18, 15, 0.65); backdrop-filter: blur(4px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
.dr {
  position: fixed; top: 0; bottom: 0; left: 0; width: 320px; max-width: 86vw; background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle); z-index: 101; transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); padding: 28px 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-md);
}
body.open .dr { transform: none; } body.open .ov { opacity: 1; pointer-events: auto; }
.dr-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 8px; }
.dr-title { font-family: var(--font-heading); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.dr-links { display: flex; flex-direction: column; gap: 6px; }
.dr a {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: var(--pill-radius);
  color: var(--text-main); text-decoration: none; font-family: var(--font-heading); font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
}
.dr a:hover { background: var(--bg-subtle); }
.dr a.on { background: var(--brand-green); color: #163300; }
.dr-meta { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-subtle); font-size: 13px; color: var(--text-subtle); display: flex; flex-direction: column; gap: 4px; }
.wise-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); padding: 24px; box-shadow: var(--shadow-sm); }
.wise-card-title { font-family: var(--font-heading); font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 16px; display: flex; align-items: center; gap: 10px; }
.wise-card-subtitle { color: var(--text-muted); font-size: 14.5px; line-height: 1.5; margin: -8px 0 18px; }
.wise-hero { background: linear-gradient(145deg, var(--bg-surface) 0%, var(--bg-subtle) 100%); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); padding: 32px 28px; box-shadow: var(--shadow-md); position: relative; overflow: hidden; }
.wise-hero-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-green); color: #163300; font-family: var(--font-heading); font-weight: 700; font-size: 12px; padding: 6px 12px; border-radius: var(--pill-radius); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
.wise-hero h1 { font-family: var(--font-heading); font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 12px; }
.wise-hero p { color: var(--text-muted); font-size: 16px; line-height: 1.55; margin: 0 0 24px; max-width: 540px; }
.hero-visual-card { background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--inner-radius); padding: 16px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-around; gap: 12px; }
.lane-pill { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); background: var(--bg-subtle); padding: 8px 14px; border-radius: var(--pill-radius); }
.btn { font-family: var(--font-heading); font-weight: 700; font-size: 15px; padding: 14px 24px; border-radius: var(--pill-radius); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: all 0.15s ease; user-select: none; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--brand-green); color: #163300; box-shadow: 0 4px 14px rgba(159, 232, 112, 0.25); }
.btn-primary:hover { background: var(--brand-green-hover); }
.btn-secondary { background: var(--bg-subtle); color: var(--text-main); border-color: var(--border-subtle); }
.btn-secondary:hover { background: var(--border-subtle); }
.btn-outline-action { background: transparent; color: var(--text-main); border: 1.5px solid var(--border-strong); }
.btn-outline-action:hover { background: var(--bg-subtle); border-color: var(--brand-green); }
.btn-danger { background: var(--danger-bg); color: var(--danger-text); }
.btn-danger:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-group .btn { flex: 1; min-width: 140px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
label { font-family: var(--font-heading); font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
input, select, textarea { width: 100%; font-family: var(--font-main); font-size: 15px; font-weight: 500; color: var(--text-main); background: var(--bg-subtle); border: 1.5px solid var(--border-subtle); border-radius: var(--inner-radius); padding: 13px 16px; outline: none; transition: border-color 0.15s ease; }
input:focus, select:focus, textarea:focus { border-color: var(--brand-green); background: var(--bg-surface); }
input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg-subtle); padding: 14px 18px; border-radius: var(--inner-radius); margin: 12px 0; cursor: pointer; }
.switch-label { font-weight: 700; font-size: 15px; color: var(--text-main); }
.switch-input { width: 20px; height: 20px; accent-color: #163300; cursor: pointer; }
.tally-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.tally-pad { background: var(--bg-surface); border: 2px solid var(--border-subtle); border-radius: var(--card-radius); padding: 22px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.12s ease; user-select: none; box-shadow: var(--shadow-sm); }
.tally-pad:hover { border-color: var(--brand-green); }
.tally-pad:active { transform: scale(0.96); background: var(--brand-green); border-color: var(--brand-green); }
.tally-pad:active .tally-name, .tally-pad:active .tally-count { color: #163300 !important; }
.tally-name { font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--text-muted); text-align: center; margin-bottom: 6px; }
.tally-count { font-family: var(--font-heading); font-size: 38px; font-weight: 800; color: var(--text-main); line-height: 1; }
.tally-status-bar { display: flex; align-items: center; justify-content: space-between; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--inner-radius); padding: 14px 20px; margin: 14px 0; }
.tally-metric { font-size: 15px; font-weight: 600; }
.tally-metric b { font-family: var(--font-heading); font-size: 20px; font-weight: 800; color: var(--brand-green); }
.table-wrap { overflow-x: auto; border-radius: var(--inner-radius); border: 1px solid var(--border-subtle); background: var(--bg-surface); margin: 12px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; white-space: nowrap; }
th, td { padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); text-align: right; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { background: var(--bg-subtle); color: var(--text-muted); font-family: var(--font-heading); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
tfoot td { font-weight: 800; background: var(--bg-subtle); color: var(--text-main); }
.kv-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-subtle); font-size: 14.5px; }
.kv-row:last-child { border-bottom: none; }
.kv-label { color: var(--text-muted); font-weight: 500; }
.kv-value { font-family: var(--font-heading); font-weight: 700; color: var(--text-main); }
.chart-box { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); padding: 24px; margin: 18px 0; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; }
.chart-header { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 18px; }
.chart-title { font-family: var(--font-heading); font-size: 17px; font-weight: 700; color: var(--text-main); }
.chart-inner { height: 380px; width: 100%; max-width: 600px; position: relative; display: flex; justify-content: center; align-items: center; }
.wise-procedure { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 8px; }
.procedure-step { display: flex; align-items: flex-start; gap: 16px; padding: 16px; border-radius: var(--inner-radius); background: var(--bg-subtle); cursor: pointer; transition: all 0.15s ease; border: 1px solid transparent; }
.procedure-step:hover { background: var(--bg-surface); border-color: var(--border-subtle); box-shadow: var(--shadow-sm); }
.step-num { width: 32px; height: 32px; border-radius: var(--pill-radius); background: var(--brand-green); color: #163300; font-family: var(--font-heading); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.step-info b { font-family: var(--font-heading); font-size: 16px; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 4px; }
.step-info div { font-size: 13.5px; color: var(--text-muted); line-height: 1.45; }
.wise-banner { background: var(--bg-subtle); border-left: 4px solid var(--brand-green); padding: 14px 18px; border-radius: 0 var(--inner-radius) var(--inner-radius) 0; font-size: 13.5px; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; }
.wise-banner.warning { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.1); color: var(--text-main); }
.footer-note { text-align: center; font-size: 13px; color: var(--text-subtle); margin-top: 18px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(14, 18, 15, 0.72); backdrop-filter: blur(6px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); max-width: 440px; width: 100%; padding: 28px 24px; box-shadow: var(--shadow-md); transform: scale(0.96) translateY(10px); transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; gap: 16px; }
.modal-overlay.active .modal-card { transform: scale(1) translateY(0); }
.modal-icon-badge { width: 48px; height: 48px; border-radius: 50%; background: var(--danger-bg); color: var(--danger); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 4px; }
.modal-title { font-family: var(--font-heading); font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); margin: 0; }
.modal-body { font-size: 14.5px; line-height: 1.55; color: var(--text-muted); margin: 0; }
.modal-actions { display: flex; gap: 10px; margin-top: 8px; }
.modal-actions .btn { flex: 1; }
</style>
</head>
<body>
<div class="app-container">
<header class="header-bar">
<div class="brand-badge">
<div class="brand-icon">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="18"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>

</button>

<svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20"><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
</button>

<a data-t="setup"><svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="18"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg> Setup</a>

<script>
const KEY = "trafficTool6", $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q = s => '"' + String(s).replace(/"/g, '""') + '"';

const def = () => ({
  cls: [],
  dirs: [{name: ""}],
  start: "",
  end: "",
  iv: 15,
  usePce: false,
  date: "",
  cur: {d: 0, s: 0},
  log: [],
  data: {},
  hist: [],
  tab: "home",
  path: "count",
  surveyStarted: false
});

let S = def(), SL = [], A = [], MSG = [], PEND = null;
try {
  const r = localStorage.getItem(KEY);
  if (r) Object.assign(S, JSON.parse(r));
} catch(e) {}
if (!Array.isArray(S.dirs) || S.dirs.length === 0) S.dirs = [{name: ""}];

const validTabs = ["home", "setup", "count", "res", "imp"];
const initialHash = (location.hash || "").replace("#", "");
if (validTabs.includes(initialHash)) S.tab = initialHash;
else if (!validTabs.includes(S.tab)) S.tab = "home";

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const dn = i => (S.dirs[i] && S.dirs[i].name && S.dirs[i].name.trim()) || "Direction " + (i + 1);
const cn = i => (S.cls[i] && S.cls[i].name && S.cls[i].name.trim()) || "Class " + (i + 1);
const locked = () => Object.keys(S.data).length > 0;
const tm = m => {
  m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
};
const pm = t => {
  if (!t || !t.includes(":")) return NaN;
  const [h, m] = t.split(":").map(Number);
  if (isNaN(h) || isNaN(m)) return NaN;
  return h * 60 + m;
};
function slots(st = S.start, en = S.end, iv = S.iv) {
  if (!st || !en) return [];
  let a = pm(st), b = pm(en);
  if (isNaN(a) || isNaN(b) || b <= a) return [];
  const n = Math.min(200, Math.floor((b - a) / iv)), L = [];
  for (let i = 0; i < n; i++) L.push(tm(a + i * iv) + " to " + tm(a + (i + 1) * iv));
  return L;
}

const sum = v => (v || []).reduce((a, b) => a + (b || 0), 0);
const getPceFactor = (i) => {
  if (!S.usePce) return 1.0;
  const c = S.cls[i];
  if (c && c.pce !== "" && !isNaN(+c.pce)) return +c.pce;
  return 1.0;
};
const pcu = v => (v || []).reduce((a, n, i) => a + (n || 0) * getPceFactor(i), 0);
const meas = v => pcu(v);
const UN = () => "PCU";
const pceMissing = () => S.usePce ? S.cls.map((c, i) => !(c && c.pce !== "" && !isNaN(+c.pce) && +c.pce > 0) ? cn(i) : null).filter(Boolean) : [];
const key = () => S.cur.d + "|" + S.cur.s;
const dl = (name, text) => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"}));
  a.download = name; a.click();
};
function rowsList() {
  return Object.keys(S.data).map(k => k.split("|").map(Number)).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(([d, s]) => ({d, s, v: S.data[d + "|" + s]}));
}
const pmWarn = () => pceMissing().length ? '<div class="wise-banner warning"><b>PCE Attention:</b> Factor not set for: ' + esc(pceMissing().join(", ")) + '. Default factor of 1.0 PCU applied.</div>' : "";

}
function closeResetModal() {
  const m = $("confirm-modal");

}

};

});

  if (t.id === "newsv") { openResetModal(() => resetEntireSurvey("home")); return; }
  if (t.dataset.add === "c") S.cls.push({name: "", pce: ""});
  else if (t.dataset.add === "d") S.dirs.push({name: ""});
  else if (t.dataset.rm === "c") S.cls.splice(+t.dataset.i, 1);
  else if (t.dataset.rm === "d") { removeDirection(+t.dataset.i); return; }
  else return;
  save(); renderSetup();
});

function removeDirection(idx) {
  if (S.dirs.length <= 1) return;
  S.dirs.splice(idx, 1);
  const remappedData = {};
  for (const k in S.data) {
    const [d, s] = k.split("|").map(Number);
    if (d === idx) continue;
    remappedData[(d > idx ? d - 1 : d) + "|" + s] = S.data[k];
  }
  S.data = remappedData;
  S.log = S.log.filter(l => l.d !== idx).map(l => ({ ...l, d: l.d > idx ? l.d - 1 : l.d }));
  S.hist = S.hist.filter(h => Number(h[0].split("|")[0]) !== idx).map(h => {
    const [d, s] = h[0].split("|").map(Number);
    return [(d > idx ? d - 1 : d) + "|" + s, h[1]];
  });
  if (S.cur.d >= S.dirs.length) S.cur.d = Math.max(0, S.dirs.length - 1);
  save(); render();
}

function tally() {
  if (!$("tot")) return;
  const v = S.data[key()] || [];
  S.cls.forEach((c, i) => { const n = $("n" + i); if (n) n.textContent = v[i] || 0; });
  $("tot").textContent = sum(v);
  if ($("pce")) $("pce").textContent = pcu(v).toFixed(1);

  const L = rowsList();
  if (!L.length) {
    $("tbl").innerHTML = "<tr><td class='wise-card-subtitle' style='text-align:center; padding:24px;'>No counts recorded yet. Tap vehicle cards above to start tallying.</td></tr>";
    return;
  }
  let h = "<tr><th>Window</th><th>Direction</th>" + S.cls.map((c, i) => "<th>" + esc(cn(i)) + "</th>").join("") + "<th>Vehicles</th><th>PCU</th></tr>";
  const tt = S.cls.map(() => 0);
  L.forEach(r => {
    S.cls.forEach((c, i) => tt[i] += r.v[i] || 0);
    h += "<tr><td>" + (SL[r.s] || "Session " + (r.s + 1)) + "</td><td>" + esc(dn(r.d)) + "</td>" + S.cls.map((c, i) => "<td>" + (r.v[i] || "—") + "</td>").join("") + "<td>" + sum(r.v) + "</td><td><b>" + pcu(r.v).toFixed(1) + "</b></td></tr>";
  });
  h += "<tfoot><tr><td>Total</td><td></td>" + tt.map(n => "<td>" + n + "</td>").join("") + "<td>" + sum(tt) + "</td><td>" + pcu(tt).toFixed(1) + "</td></tr></tfoot>";
  $("tbl").innerHTML = h;
}

function countsCSV() {
  let s = "Date,Direction,Session," + S.cls.map((c, i) => q(cn(i))).join(",") + ",Total Vehicles,PCU\n";
  rowsList().forEach(r => {
    const v = S.cls.map((c, i) => r.v[i] || 0);
    s += [S.date || "", q(dn(r.d)), q(SL[r.s] || ""), ...v, sum(v), pcu(v).toFixed(2)].join(",") + "\n";
  });
  return s;
}

$("count").addEventListener("click", e => {
  const pad = e.target.closest("[data-tap]");
  if (pad) {
    const i = +pad.dataset.tap, k = key(), v = S.data[k] = S.data[k] || [];
    while (v.length < S.cls.length) v.push(0);
    v[i]++; S.hist.push([k, i]);
    try { if (navigator.vibrate) navigator.vibrate(20); } catch(x) {}
    save(); tally(); return;
  }
  const btn = e.target.closest("button"); if (!btn) return;
  const a = btn.dataset.a; if (!a) return;
  if (a === "next" || a === "prev") {
    S.cur.s = Math.max(0, Math.min(SL.length - 1, S.cur.s + (a === "next" ? 1 : -1)));
    save(); $("count").querySelector('[data-s="s"]').value = S.cur.s; tally();
  } else if (a === "undo") {
    const h = S.hist.pop(); if (!h) return;
    const v = S.data[h[0]];
    if (v) { v[h[1]]--; if (!v.some(n => n)) delete S.data[h[0]]; }
    save(); tally();
  } else if (a === "dl") {
    dl("traffic-count-" + (S.date || "field-log") + ".csv", countsCSV());
  } else if (a === "copy") {
    const s = countsCSV(), x = $("csv"); x.value = s; x.style.display = "block";
    (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject())
      .then(() => btn.textContent = "Copied ✓")
      .catch(() => { x.select(); btn.textContent = "Copied text below"; });
    setTimeout(() => btn.textContent = "Copy CSV Data", 2500);
  } else if (a === "reset") {
    openResetModal(() => { S.data = {}; S.hist = []; S.log = []; S.cur.s = 0; save(); render(); });
  }
});

function analyse(di) {
  const n = SL.length, k = Math.round(60 / S.iv);
  const vol = SL.map((_, s) => pcu(S.data[di + "|" + s]));
  const vh = SL.map((_, s) => sum(S.data[di + "|" + s]));
  const r = {vol, k, n, tot: vol.reduce((a, b) => a + b, 0), totv: vh.reduce((a, b) => a + b, 0)};
  if (n >= k && k > 0) {
    let bestPCU = -1, bi = 0;
    for (let i = 0; i <= n - k; i++) {
      let t = 0; for (let j = 0; j < k; j++) t += vol[i + j];
      if (t > bestPCU) { bestPCU = t; bi = i; }
    }
    r.start = bi; r.phv = bestPCU; r.veh = 0;
    for (let j = 0; j < k; j++) r.veh += vh[bi + j];
    r.mx = Math.max(...vol.slice(bi, bi + k));
    r.phf = (r.mx && r.mx > 0) ? bestPCU / (k * r.mx) : null;
  }
  return r;
}
const pl = r => (SL[r.start] ? SL[r.start].split(" to ")[0] : "") + " to " + (SL[r.start + r.k - 1] ? SL[r.start + r.k - 1].split(" to ")[1] : "");

function mk(id, cfg) {
  if (CH[id]) CH[id].destroy();
  CH[id] = new Chart($(id), cfg);
}

// Generate high-resolution standalone data URL for PDF reports
function getChartImageUri(id) {
  try {
    const inst = CH[id];
    if (inst && inst.canvas) {
      // Create a solid white background canvas copy to avoid any transparency or cross-window taint
      const w = inst.canvas.width || 800;
      const h = inst.canvas.height || 360;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(inst.canvas, 0, 0, w, h);
      const uri = c.toDataURL("image/png", 1.0);
      if (uri && uri.startsWith("data:image/png;base64,") && uri.length > 200) {
        return uri;
      }
    }
  } catch(e) {
    console.error("Could not capture chart " + id, e);
  }
  return "";
}

  } else if (t.closest("#rcsv")) {
    let s = "Direction,Peak hour,Peak hour volume (PCU/h),Peak hour volume (vehicles),PHF,Total PCU,Total vehicles\n";
    S.dirs.forEach((d, i) => {
      const r = A[i];
      s += [q(dn(i)), r.start != null ? q(pl(r)) : "n/a", r.phv != null ? r.phv.toFixed(1) : "", r.veh != null ? r.veh : "", S.iv === 60 ? "n/a" : (r.phf != null ? r.phf.toFixed(2) : ""), r.tot.toFixed(1), r.totv].join(",") + "\n";
    });
    s += "\nSession," + S.dirs.map((d, i) => q(dn(i) + " (PCU)")).join(",") + "\n";
    SL.forEach((x, si) => {
      s += q(x) + "," + S.dirs.map((_, i) => (A[i] && A[i].vol && A[i].vol[si] != null ? A[i].vol[si].toFixed(1) : "0")).join(",") + "\n";
    });
    dl("traffic-survey-results.csv", s);
  }
});

const hash = t => {
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
  return h + "_" + t.length;
};
function parseCSV(t) {
  const R = []; let r = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c == '"') { if (t[i + 1] == '"') { f += '"'; i++; } else q = false; } else f += c;
    } else if (c == '"') q = true;
    else if (c == ",") { r.push(f); f = ""; }
    else if (c == "\n") { r.push(f); R.push(r); r = []; f = ""; }
    else if (c != "\r") f += c;
  }
  if (f || r.length) { r.push(f); R.push(r); }
  return R.filter(x => x.some(v => v.trim()));
}
function parseCounts(t) {
  const R = parseCSV(t.replace(/^\uFEFF/, ""));
  if (R.length < 2) return {err: "File is blank or unreadable."};
  const H = R[0].map(x => x.trim()), iS = H.indexOf("Session");
  let iT = H.indexOf("Total Vehicles");
  if (iT < 0) iT = H.indexOf("Total");
  if (iS < 0 || iT < 0 || iT <= iS + 1) return {err: "Invalid structure."};
  const names = H.slice(iS + 1, iT), rows = [];
  for (const x of R.slice(1)) {
    const m = (x[iS] || "").trim().match(/^(\d\d:\d\d) to (\d\d:\d\d)$/);
    if (!m) continue;
    let a = pm(m[1]), b = pm(m[2]);
    if (b <= a) b += 1440;
    rows.push({
      label: x[iS].trim(), a, b,
      v: names.map((_, j) => Math.max(0, parseInt(x[iS + 1 + j]) || 0))
    });
  }
  return rows.length ? {names, rows} : {err: "No valid session rows parsed."};
}
function plan(d, P, mode) {
  const cls = S.cls.map(c => ({...c})), newCls = [], skipped = [], ok = [];
  let conf = 0, iv = S.iv, a = pm(S.start) || 0, b = pm(S.end) || 0;
  if (b <= a) b += 1440;
  const was = locked(); let first = !was;
  for (const f of P) {
    const fi = f.rows[0].b - f.rows[0].a, fa = Math.min(...f.rows.map(r => r.a)), fb = Math.max(...f.rows.map(r => r.b));
    if (![15, 30, 60].includes(fi) || f.rows.some(r => r.b - r.a !== fi)) { skipped.push(f.name + ": intervals must be 15, 30 or 60 min"); continue; }
    if (first) { a = fa; b = fb; iv = fi; first = false; }
    else if (fi !== iv) { skipped.push(f.name + ": interval size (" + fi + "m) differs from survey (" + iv + "m)"); continue; }
    else if (b <= 1440 && fb <= 1440) { a = Math.min(a, fa); b = Math.max(b, fb); }
    ok.push(f);
  }
  const nsl = slots(tm(a), tm(b), iv), osl = slots(), src = {};
  for (const k in S.data) {
    const [dd, si] = k.split("|"), ni = iv === S.iv ? nsl.indexOf(osl[+si]) : -1;
    if (ni >= 0) src[dd + "|" + ni] = S.data[k].slice();
  }
  for (const f of ok) {
    const map = f.names.map(n => {
      let i = cls.findIndex(c => c.name.trim().toLowerCase() === n.trim().toLowerCase());
      if (i < 0) { cls.push({name: n.trim(), pce: ""}); newCls.push(n.trim()); i = cls.length - 1; }
      return i;
    });
    for (const r of f.rows) {
      const si = nsl.indexOf(r.label);
      if (si < 0) { skipped.push(f.name + ": " + r.label + " falls outside survey time"); continue; }
      const k = d + "|" + si, t = src[k] = src[k] || [];
      while (t.length < cls.length) t.push(0);
      r.v.forEach((n, j) => {
        if (!n) return;
        const ci = map[j];
        if (t[ci] > 0) { conf++; if (mode === "replace") t[ci] = n; else if (mode === "add") t[ci] += n; }
        else t[ci] = n;
      });
      if (!t.some(x => x)) delete src[k];
    }
  }
  return {data: src, cls, st: tm(a), en: tm(b), iv, conf, skipped, ok, newCls};
}

async function doImport(d, files) {
  MSG = []; const parsed = [];
  for (const f of files) {
    const t = await f.text(), h = hash(t);
    if (S.log.some(l => l.h === h) || parsed.some(p => p.h === h)) {
      MSG.push(f.name + ": duplicate skipped"); continue;
    }
    const r = parseCounts(t);
    if (r.err) { MSG.push(f.name + ": " + r.err); continue; }
    r.name = f.name; r.h = h; parsed.push(r);
  }
  PEND = null;
  if (!parsed.length) { renderImport(); return; }
  PEND = {d, parsed};
  if (plan(d, parsed, "keep").conf) renderImport();
  else commit("keep");
}

function commit(mode) {
  const {d, parsed} = PEND, r = plan(d, parsed, mode);
  PEND = null;
  S.data = r.data; S.cls = r.cls; S.start = r.st; S.end = r.en; S.iv = r.iv; S.hist = []; S.cur.s = 0;
  r.ok.forEach(f => S.log.push({h: f.h, name: f.name, d, n: f.rows.length}));
  MSG.push(...[...new Set(r.skipped)].slice(0, 6));
  if (r.ok.length) MSG.push("Imported " + r.ok.length + " file" + (r.ok.length > 1 ? "s" : "") + " into " + dn(d));
  if (r.newCls.length) MSG.push("Detected classes: " + r.newCls.join(", "));
  save(); render();
}

function renderImport() {
  SL = slots();
  const c = PEND ? plan(PEND.d, PEND.parsed, "keep").conf : 0;
  let h = "";
  if (MSG.length) h += `<div class="wise-banner warning">${MSG.map(esc).join("<br>")}</div>`;
  if (PEND) {
    h += `
    <div class="wise-card">
      <div class="wise-card-title">Overlap Resolution</div>
      <p class="wise-card-subtitle">${c} count records collide for <b>${esc(dn(PEND.d))}</b>. Select how to merge:</p>
      <div class="btn-group">
        <button class="btn btn-primary" data-mode="keep">Preserve Existing</button>
        <button class="btn btn-secondary" data-mode="replace">Use Imported</button>
        <button class="btn btn-secondary" data-mode="add">Add Counts</button>
        <button class="btn btn-danger" data-mode="cancel">Cancel</button>
      </div>
    </div>
    `;
  }
  h += `<div class="wise-card"><div class="wise-card-title">Multi-Device Import</div><div class="wise-card-subtitle">Combine CSV files recorded across multiple smartphones or surveyors into a single unified dataset.</div></div>`;
  const multiDirs = S.dirs.length > 1;
  S.dirs.forEach((d, i) => {
    const L = S.log.filter(l => l.d === i), n = Object.keys(S.data).filter(k => k.startsWith(i + "|")).length;
    h += `
    <div class="wise-card">
      <div class="form-group">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
          <label style="margin:0;">Direction Label ${multiDirs ? `(${i + 1})` : ''}</label>
          <button class="btn btn-secondary btn-danger" style="padding:4px 12px; height:32px; font-size:13px; gap:4px;" data-rm-d="${i}" ${multiDirs ? '' : 'disabled'}>✕ Remove</button>
        </div>
        <input data-n="${i}" placeholder="e.g. Northbound" value="${esc(d.name || "")}">
      </div>
      <label class="btn btn-primary" style="display:inline-flex; width:100%; cursor:pointer;">
        <span>Select CSV Files for ${esc(dn(i))}</span>
        <input type="file" accept=".csv,text/csv" multiple data-f="${i}" style="display:none">
      </label>
      <div class="wise-card-subtitle" style="margin-top:12px; margin-bottom:0;">${n} session${n === 1 ? "" : "s"} currently recorded.</div>
    </div>
    `;
  });
  h += `
  <button class="btn btn-secondary btn-block" data-add="1">+ Add another direction approach</button>
  <div class="btn-group" style="margin-top:14px;">
    <button class="btn btn-primary" data-go="setup" data-path="imp">Next: Review Setup</button>
    <button class="btn btn-secondary" data-go="res" data-path="imp">View Results</button>
  </div>
  `;
  $("imp").innerHTML = h;
}

$("imp").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.f !== undefined) { const fl = [...t.files]; t.value = ""; doImport(+t.dataset.f, fl); }
});
$("imp").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.n !== undefined) { S.dirs[+t.dataset.n].name = t.value; save(); }
});
$("imp").addEventListener("click", e => {
  const t = e.target, rmBtn = t.closest("[data-rm-d]");
  if (rmBtn) { removeDirection(+rmBtn.dataset.rmD); renderImport(); return; }
  if (t.dataset.add) { S.dirs.push({name: ""}); save(); renderImport(); }
  else if (t.dataset.mode) {
    if (t.dataset.mode === "cancel") { PEND = null; MSG = []; renderImport(); }
    else commit(t.dataset.mode);
  }
});

initTheme();
if (!history.state) history.replaceState({ tab: S.tab }, '', '#' + S.tab);
render();
</script>
</body></html>
